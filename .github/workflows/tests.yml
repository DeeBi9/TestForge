name: TestForge API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run API tests
        working-directory: automation
        run: mvn test

      - name: Print test results
        if: always()
        working-directory: automation
        run: cat target/surefire-reports/*.txt 2>/dev/null || echo "No test reports found"
